<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Beacon — metrics</title>
<style>
  :root{--ink:#14181d;--muted:#5b6670;--line:#e2e6ea;--bg:#f6f7f9;--card:#fff;--accent:#2f5bea;--ok:#177245;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:16px;letter-spacing:-.01em}
  h1 span{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
  .pill{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid #cfe6da;background:#f2faf5;color:var(--ok);white-space:nowrap}
  main{max-width:900px;margin:0 auto;padding:18px 20px 40px;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  input,select{padding:8px 10px;font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit;min-width:0}
  #route,#latency{width:190px}
  button{font:inherit;font-weight:600;padding:8px 13px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  button.secondary{background:#fff;color:var(--ink);border-color:var(--line)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .out{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin:0;background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:420px;overflow:auto}
  .hint{color:var(--muted);font-size:12.5px;margin:12px 0 0}
</style>
</head>
<body>
<header>
  <h1>Beacon<span>counters and histograms, rendered in Prometheus text format</span></h1>
  <span id="pill" class="pill">live</span>
</header>
<main>
  <section class="card">
    <label>Record a request</label>
    <div class="row">
      <input id="route" type="text" value="/checkout" aria-label="route" />
      <select id="status" aria-label="status">
        <option>200</option>
        <option>404</option>
        <option>500</option>
      </select>
      <button id="hit" type="button">+1 request</button>
    </div>
    <label style="margin-top:16px">Observe a latency in seconds</label>
    <div class="row">
      <input id="latency" type="text" value="0.08" aria-label="latency seconds" />
      <button id="observe" type="button">Record latency</button>
    </div>
    <div class="row">
      <button id="reset" class="secondary" type="button">Reset registry</button>
    </div>
    <p class="hint">Every button hits the real registry. The text below is exactly what a Prometheus scrape of <code>/metrics</code> would return.</p>
  </section>
  <section class="card">
    <label>GET /metrics</label>
    <pre id="out" class="out">loading…</pre>
  </section>
</main>
<script>
  const $ = (selector) => document.querySelector(selector);

  async function call(path, body) {
    const res = await fetch(path, body === undefined ? {} : {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    if (res.ok) await refresh();
    else $("#pill").textContent = "error " + res.status;
  }

  async function refresh() {
    const res = await fetch("/metrics");
    $("#out").textContent = await res.text();
  }

  $("#hit").addEventListener("click", () => call("/requests", { route: $("#route").value, status: $("#status").value }));
  $("#observe").addEventListener("click", () => call("/latency", { route: $("#route").value, seconds: Number($("#latency").value) }));
  $("#reset").addEventListener("click", () => call("/reset", {}));

  refresh();
</script>
</body>
</html>
